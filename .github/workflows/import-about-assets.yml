name: Import verified About assets
on:
  push:
    branches: \[about-ahmed-liquid-glass\]
    paths: \['.github/workflows/import-about-assets.yml'\]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and copy the uploaded edition
        shell: bash
        run: |
          set -euo pipefail
          python3 - &lt;&lt;'PY'
          import hashlib, io, json, pathlib, re, urllib.request, zipfile
          url = '[https://codeload.github.com/nachitzaid/lando-noris/zip/3cfd921759f689cf7d53b9a07ff88fa38d6a8956](https://codeload.github.com/nachitzaid/lando-noris/zip/3cfd921759f689cf7d53b9a07ff88fa38d6a8956)'
          with urllib.request.urlopen(url,timeout=60) as r: archive = zipfile.ZipFile(io.BytesIO(r.read(24*10241024)))
          files = {}
          for item in archive.infolist():
              p = item.filename.partition('/')\[2\]
              if item.is\_dir() or not (p == 'index.html' or p.startswith(('gl/','rive/','js/','css/'))): continue
              assert not pathlib.PurePosixPath(p).is\_absolute() and '..' not in pathlib.PurePosixPath(p).parts and p not in files
              files\[p\] = archive.read(item)
          def digest(): return hashlib.sha256(b''.join(p.encode()+b'\\0'+hashlib.sha256(b).digest() for p,b in sorted(files.items()))).hexdigest()
          assert len(files)==68 and digest()=='fea9e87cbc435d8903feb48e3929222a31af4734cdb5e6596f217f7a50957e40', 'Original assets differ from upload'
          for p,b in list(files.items()):
              if p=='index.html':
                  s=re.sub(r'''(\["'\])/(css|js|gl|rive)/''',r'\\1./\\2/',b.decode()); files\[p\]=re.sub(r'<script\\b\[^>\]\\bsrc="/avlj\[^"\]\*"\[^&gt;\]*&gt;\\s\*</script>', '',s,flags=re.I).encode()
              elif p.startswith('js/'):
                  files\[p\]=re.sub(r'''(\["'`])/(gl|rive)(?=/|["'`\])''',r'\\1./\\2',b.decode()).encode()
          files\['manifest.json'\]=json.dumps({'entry':'index.html'}).encode()
          assert digest()=='c3844aaae3c86a1c4412232d0f1852ff4d0c1028273106d356352f85914386a1','Prepared files differ from delivery'
          for p,b in files.items():
              dest=pathlib.Path('public/about-ahmed')/p; dest.parent.mkdir(parents=True,exist\_ok=True); dest.write\_bytes(b)
          PY
          git add -- public/about-ahmed
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions\[bot\]' -c user.email='41898282+github-actions\[bot\]@users.noreply.github.com' commit -m 'إضافة ملفات عرض عن أحمد المطابقة للمرفق'
            git push origin HEAD:refs/heads/about-ahmed