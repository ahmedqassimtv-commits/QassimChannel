name: Import verified About assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: about-ahmed-liquid-glass
      - name: Restore the existing navigation and add About
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import subprocess
          p='src/components/layout/Navbar.jsx'
          s=subprocess.run(['git','show','origin/main:'+p],check=True,text=True,capture_output=True).stdout
          pairs=[
            ("  Radio,\n  Film,", "  Radio,\n  UserRound,\n  Film,"),
            ("  { title: 'أون إير — ON AIR', sub: 'منشورات وحضور قاسم الحيّ', to: '/on-air', icon: Radio },\n]", "  { title: 'أون إير — ON AIR', sub: 'منشورات وحضور قاسم الحيّ', to: '/on-air', icon: Radio },\n  { title: 'عن أحمد', sub: 'الملف التعريفي', to: '/about', icon: UserRound },\n]"),
            ("  { to: '/on-air', label: 'أون إير', badge: 'ON AIR', icon: Radio },\n]", "  { to: '/on-air', label: 'أون إير', badge: 'ON AIR', icon: Radio },\n  { to: '/about', label: 'عن أحمد', icon: UserRound },\n]"),
            ("  if (pathname.startsWith('/on-air')) return '/on-air'\n  return '/'", "  if (pathname.startsWith('/on-air')) return '/on-air'\n  if (pathname.startsWith('/about')) return '/about'\n  return '/'")]
          for old,new in pairs:
              assert s.count(old)==1, 'Expected one known navigation anchor'
              s=s.replace(old,new,1)
          open(p,'w').write(s)
          assert s.count("to: '/about'")==2 and s.count("pathname.startsWith('/about')")==1
          PY
          git rm -- src/components/layout/liquid-nav.css
      - name: Restore the verified uploaded page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, pathlib, re, urllib.request, zipfile
          url='https://codeload.github.com/nachitzaid/lando-noris/zip/3cfd921759f689cf7d53b9a07ff88fa38d6a8956'
          with urllib.request.urlopen(url,timeout=60) as r: archive=zipfile.ZipFile(io.BytesIO(r.read(24*1024*1024)))
          files={}
          for item in archive.infolist():
              p=item.filename.partition('/')[2]
              if item.is_dir() or not(p=='index.html' or p.startswith(('gl/','rive/','js/','css/'))): continue
              assert not pathlib.PurePosixPath(p).is_absolute() and '..' not in pathlib.PurePosixPath(p).parts and p not in files
              files[p]=archive.read(item)
          def digest(): return hashlib.sha256(b''.join(p.encode()+b'\0'+hashlib.sha256(b).digest() for p,b in sorted(files.items()))).hexdigest()
          assert len(files)==68 and digest()=='fea9e87cbc435d8903feb48e3929222a31af4734cdb5e6596f217f7a50957e40','Source does not match the upload'
          for p,b in list(files.items()):
              if p=='index.html':
                  s=re.sub(r'''(["'])/(css|js|gl|rive)/''',r'\1./\2/',b.decode()); files[p]=re.sub(r'<script\b[^>]*\bsrc="/avlj[^\"]*"[^>]*>\s*</script>','',s,flags=re.I).encode()
              elif p.startswith('js/'): files[p]=re.sub(r'''(["'`])/(gl|rive)(?=/|["'`])''',r'\1./\2',b.decode()).encode()
          files['manifest.json']=json.dumps({'entry':'index.html'}).encode()
          assert digest()=='c3844aaae3c86a1c4412232d0f1852ff4d0c1028273106d356352f85914386a1','Prepared files differ from delivery'
          root=pathlib.Path('public/about-ahmed'); assert not root.is_symlink() and not root.parent.is_symlink()
          for p,b in files.items():
              dest=root/p; assert dest.resolve()==dest.absolute(); dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(b)
          PY
          git add -- src/components/layout/Navbar.jsx public/about-ahmed
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'استعادة وظائف التنقل وإضافة قسم عن أحمد'
            git push origin HEAD:refs/heads/about-ahmed-liquid-glass
          fi
