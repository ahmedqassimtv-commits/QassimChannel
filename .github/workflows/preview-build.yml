# بناء تجريبي لأي فرع غير main: بيتأكد إن البناء ناجح وبيرفع dist كـ artifact
# للمراجعة قبل الدمج. مابينشرش حاجة على الموقع.
name: Preview build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/QassimChannel/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      # نسخة من البناء على فرع preview-dist (للمراجعة بـ git من أي مكان)
      - name: Push build to preview-dist
        run: |
          cd dist
          git init -q -b preview-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "preview build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-dist
