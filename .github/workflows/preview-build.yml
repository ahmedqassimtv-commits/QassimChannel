# بناء تجريبي لأي فرع غير main: بيتأكد إن البناء ناجح وبيرفع dist كـ artifact
# للمراجعة قبل الدمج. مابينشرش حاجة على الموقع.
name: Preview build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/QassimChannel/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
