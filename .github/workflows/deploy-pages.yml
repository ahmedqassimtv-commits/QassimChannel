# Deploy the QassimChannel site to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_about:
        description: Merge the requested About update before deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  merge_about:
    if: github.event_name == 'workflow_dispatch' && inputs.merge_about == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the reviewed About update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 14 --repo "${GITHUB_REPOSITORY}"
          gh pr merge 14 --squash --delete-branch --repo "${GITHUB_REPOSITORY}"

  build:
    if: github.event_name == 'push' || inputs.merge_about != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/QassimChannel/
        env:
          VITE_QZ_AI_ENDPOINT: ${{ vars.QZ_AI_ENDPOINT }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || inputs.merge_about != true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
