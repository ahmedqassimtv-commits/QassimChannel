# نشر الموقع على GitHub Pages مع كل push على main
# دومين خاص (مثلاً .me أو .tech مجاني من GitHub Student Pack):
#   حط الدومين في متغير الريبو PAGES_DOMAIN (Settings › Secrets and variables › Actions › Variables)
#   فالبيلد يبقى على / بدل /QassimChannel/ ويتكتب ملف CNAME لوحده.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then BASE=/; else BASE=/QassimChannel/; fi
          npm run build -- --base="$BASE"
          cp dist/index.html dist/404.html
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > dist/CNAME; fi
        env:
          VITE_QZ_AI_ENDPOINT: ${{ vars.QZ_AI_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
