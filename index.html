<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- عائلات خط ثمانية الثلاث: تحميل مسبق للأوزان الأساسية -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/thmanyahsans/woff2/thmanyahsans-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/thmanyahsans/woff2/thmanyahsans-Bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/thmanyahserifdisplay/woff2/thmanyahserifdisplay-Bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/thmanyahseriftext/woff2/thmanyahseriftext-Regular.woff2" crossorigin />
    <meta name="theme-color" content="#051F20" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="منصة قاسم للأفلام والوثائقيات والمراجعات والمقالات." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#051F20" />

    <!-- مشاركة الروابط (واتساب / فيسبوك / X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="قاسمز" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="قاسم | مساحة للصورة والحكاية" />
    <meta property="og:description" content="منصة قاسم للأفلام والوثائقيات والمراجعات والمقالات." />
    <!-- home.jpg غير موجودة في المستودع؛ تُستخدم شعار المنصة كصورة معاينة للروابط -->
    <meta property="og:image" content="/images/qassimz-logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="قاسم | مساحة للصورة والحكاية" />
    <meta name="twitter:description" content="منصة قاسم للأفلام والوثائقيات والمراجعات والمقالات." />
    <meta name="twitter:image" content="/images/qassimz-logo.svg" />

    <!-- تحميل مسبق لخلفية الصفحة الرئيسية (نسخة 1200px للموبايل و 2400px للشاشات الكبيرة) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="%BASE_URL%fractal/optimized/08.webp"
      imagesrcset="%BASE_URL%fractal/optimized/08-1200.webp 1200w, %BASE_URL%fractal/optimized/08.webp 2400w"
      imagesizes="108vmax"
      fetchpriority="high"
    />

    <!-- تطبيق الثيم المحفوظ قبل تحميل React (مفيش وميض) -->
    <script>
      // الثيمات الثلاثة فقط: green (أخضر) و red (أحمر) و gold (ذهبي)
      // أي قيمة أخرى (ومنها emerald/sand القديمتان) تُعاد إلى الأخضر الافتراضي
      var THEME_COLORS = { green: '#051F20', red: '#1A0A07', gold: '#1A1408' }
      document.documentElement.dataset.theme = 'green'
      try {
        var t = localStorage.getItem('qassimz:theme')
        if (t === 'green' || t === 'red' || t === 'gold') {
          document.documentElement.dataset.theme = t
        }
        var themeNow = document.documentElement.dataset.theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[themeNow])
        // جميع الثيمات داكنة
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark')
      } catch (e) {}
    </script>

    <title>قاسم | مساحة للصورة والحكاية</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
